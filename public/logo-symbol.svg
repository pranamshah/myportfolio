<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- Globe circle border -->
  <circle cx="110" cy="100" r="83" fill="none" stroke="#142850" stroke-width="4"/>

  <!-- Globe grid – latitudes (subtle) -->
  <ellipse cx="110" cy="64"  rx="56" ry="9"  fill="none" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="110" cy="100" rx="67" ry="11" fill="none" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="110" cy="136" rx="56" ry="9"  fill="none" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>

  <!-- Globe grid – longitudes -->
  <line x1="110" y1="22"  x2="110" y2="148" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>
  <line x1="84"  y1="27"  x2="84"  y2="148" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>
  <line x1="136" y1="27"  x2="136" y2="148" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>
  <line x1="62"  y1="46"  x2="62"  y2="143" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>
  <line x1="158" y1="46"  x2="158" y2="143" stroke="#9aaac0" stroke-width="0.9" opacity="0.5"/>

  <!-- N – left vertical pillar (dark navy) -->
  <rect x="48" y="44" width="26" height="112" rx="2" fill="#142850"/>

  <!-- N – diagonal (dark navy), from top-left corner to bottom-right -->
  <polygon points="48,44 74,44 140,156 114,156" fill="#142850"/>

  <!-- N – right vertical pillar (silver) -->
  <rect x="114" y="44" width="26" height="112" rx="2" fill="#8896b8"/>

  <!-- Mask: ensure top of right pillar sits cleanly above diagonal -->
  <polygon points="114,44 140,44 140,78 114,62" fill="#8896b8"/>

  <!-- Orbit swoosh – large elliptical arc around the globe -->
  <path d="M 22 162 Q 52 198 110 200 Q 168 198 198 162"
        stroke="#142850" stroke-width="3.5" fill="none"
        stroke-linecap="round"/>

  <!-- Container ship (left end of orbit) -->
  <g transform="translate(4,154)" fill="#142850">
    <path d="M2 22 Q2 27 5 27 L55 27 Q58 27 58 22 Z"/>
    <rect x="5" y="10" width="50" height="14"/>
    <rect x="7"  y="2"  width="10" height="9"/>
    <rect x="19" y="2"  width="10" height="9"/>
    <rect x="31" y="2"  width="10" height="9"/>
    <rect x="43" y="2"  width="10" height="9"/>
    <rect x="8"  y="-5" width="3"  height="8"/>
    <rect x="44" y="-5" width="3"  height="8"/>
  </g>

  <!-- Airplane (right end of orbit, rotated) -->
  <g transform="translate(170,126) rotate(-45)" fill="#142850">
    <ellipse cx="14" cy="8" rx="17" ry="5"/>
    <path d="M7 8 L-6 20 L-1 20 L16 12 Z"/>
    <path d="M21 8 L34 20 L29 20 L12 12 Z"/>
    <path d="M26 9 L34 4 L34 9 Z"/>
    <path d="M26 10 L32 14 L30 15 Z"/>
  </g>
</svg>
