<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- Globe circle border -->
  <circle cx="108" cy="98" r="82" fill="none" stroke="#142850" stroke-width="3.5"/>

  <!-- Globe grid – latitudes -->
  <ellipse cx="108" cy="64" rx="54" ry="9"  fill="none" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>
  <ellipse cx="108" cy="98" rx="65" ry="11" fill="none" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>
  <ellipse cx="108" cy="132" rx="54" ry="9" fill="none" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>

  <!-- Globe grid – longitudes -->
  <line x1="108" y1="22" x2="108" y2="140" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>
  <line x1="82"  y1="27" x2="82"  y2="140" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>
  <line x1="134" y1="27" x2="134" y2="140" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>
  <line x1="60"  y1="44" x2="60"  y2="138" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>
  <line x1="156" y1="44" x2="156" y2="138" stroke="#8fa0b8" stroke-width="0.9" opacity="0.55"/>

  <!-- N left pillar (dark navy) -->
  <rect x="48" y="42" width="26" height="108" fill="#142850"/>

  <!-- N diagonal (dark navy) fills from top-left to bottom-right -->
  <polygon points="48,42 74,42 138,150 112,150" fill="#142850"/>

  <!-- N right pillar (silver) -->
  <rect x="112" y="42" width="26" height="108" fill="#8896b8"/>

  <!-- Ensure top of right pillar covers diagonal correctly -->
  <polygon points="112,42 138,42 138,74 112,58" fill="#8896b8"/>

  <!-- Orbit swoosh arc from bottom-left to upper-right -->
  <path d="M 26 158 Q 52 192 108 194 Q 164 192 190 155"
        stroke="#142850" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Container ship (bottom-left of orbit) -->
  <g transform="translate(8,156)" fill="#142850">
    <path d="M0 20 Q1 25 4 25 L52 25 Q55 25 56 20 Z"/>
    <rect x="4" y="9" width="48" height="13"/>
    <rect x="6"  y="2" width="9" height="8"/>
    <rect x="17" y="2" width="9" height="8"/>
    <rect x="28" y="2" width="9" height="8"/>
    <rect x="39" y="2" width="9" height="8"/>
    <rect x="7"  y="-4" width="3" height="7"/>
    <rect x="41" y="-4" width="3" height="7"/>
  </g>

  <!-- Airplane (upper-right of orbit, rotated –30°) -->
  <g transform="translate(168,26) rotate(-28)" fill="#142850">
    <ellipse cx="12" cy="7" rx="15" ry="4.5"/>
    <path d="M6 7 L-5 17 L0 17 L14 10 Z"/>
    <path d="M18 7 L29 17 L24 17 L10 10 Z"/>
    <path d="M22 8 L30 3 L30 8 Z"/>
    <path d="M22 9 L28 12 L26 13 Z"/>
  </g>
</svg>
